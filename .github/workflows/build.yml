name: Build Hume Launcher APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Android SDK
        run: |
          SDK=/usr/lib/android-sdk
          sudo mkdir -p $SDK/cmdline-tools
          sudo chown $USER:$USER $SDK
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          rm /tmp/cmdline-tools.zip
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Build APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hume-launcher-apk
          path: build/tvos-home.apk
          retention-days: 7
